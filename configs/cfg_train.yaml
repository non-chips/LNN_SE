network_config:
  n_fft: 512
  hop_len: 256
  win_len: 512

DDP:
  world_size: 1

optimizer:
  lr: 0.001

scheduler:
  kwargs:
    warmup_steps: 500
    decay_until_step: 50000
    max_lr: 1e-3
    min_lr: 1e-6

  update_interval: step  # [step, epoch]

FFT:
  n_fft: 512
  hop_length: 256
  win_length: 512

loss:
  n_fft: ${FFT.n_fft}
  hop_len: ${FFT.hop_length}
  win_len: ${FFT.win_length}
  compress_factor: 0.3
  eps: 1e-12
  lamda_ri: 30
  lamda_mag: 70

train_dataset: 
  fs: 16000
  length_in_seconds: 2.5
  num_data_tot: 10700
  num_data_per_epoch: 8000
  random_start_point: true
  train: true

train_dataloader: 
  batch_size: 32
  num_workers: 4
  drop_last: true
  pin_memory: false

validation_dataset: 
  fs: 16000
  length_in_seconds: 2.5
  num_data_tot: 872
  num_data_per_epoch: 600
  random_start_point: false
  train: false

validation_dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: false

samplerate: 16000

trainer:
  epochs: 200
  save_checkpoint_interval: 1
  clip_grad_norm_value: 3.0
  exp_path: D:/LNN_SE/exp_lnn
  resume: false
  resume_datetime: 2026-12-31-14h28m
